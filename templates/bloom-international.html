<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom International Playway & High - School Website Template Demo</title>
    <meta name="description" content="Live website template demo for Bloom International Playway & High (CBSE Playway & K-12 Wing). Developed by Dev Sharma.">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: #ffffff;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Sticky Top Header Bar */
        .template-top-bar {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            background: #0A2540;
            color: #ffffff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            gap: 12px;
        }

        .template-top-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .template-pill-badge {
            background: rgba(0, 175, 144, 0.2);
            color: #00AF90;
            border: 1px solid rgba(0, 175, 144, 0.4);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 9999px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .template-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .template-board {
            font-size: 13px;
            color: #94A3B8;
        }

        .template-top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-claim {
            background: linear-gradient(135deg, #00AF90 0%, #008770 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            padding: 9px 20px;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 175, 144, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-claim:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 175, 144, 0.5);
            color: #ffffff;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* Empty White Page Canvas */
        .empty-white-page {
            flex: 1;
            background: #ffffff;
            width: 100%;
            min-height: calc(100vh - 65px);
            /* Empty white canvas ready for school website design */
        }
    </style>
</head>
<body>

    <!-- Sticky Top Header Bar -->
    <header class="template-top-bar">
        <div class="template-top-left">
            <span class="template-pill-badge">Demo Template</span>
            <span class="template-title">Bloom International Playway & High</span>
            <span class="template-board">• CBSE Playway & K-12 Wing</span>
        </div>
        <div class="template-top-actions">
            <a href="/?claim=bloom-international#contact" class="btn-claim">
                Get This Website For Your School &rarr;
            </a>
            <a href="/#projects" class="btn-back">
                &larr; All Templates
            </a>
        </div>
    </header>

    <!-- Empty White Page Body (Clean Canvas) -->
    <main class="empty-white-page">
        <!-- Empty White Page: Template code will be added here -->
    </main>

</body>
</html>
