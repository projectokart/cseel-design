<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AF90"/>
      <stop offset="100%" stop-color="#008770"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="14" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="797" height="497" rx="12.5" fill="none" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Simulated Browser / Wireframe Window Frame -->
  <rect x="70" y="55" width="660" height="390" rx="12" fill="url(#screenGrad)" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Window Header Bar -->
  <rect x="70" y="55" width="660" height="42" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="70" y="85" width="660" height="12" fill="#F1F5F9"/>

  <!-- Browser Controls -->
  <circle cx="95" cy="76" r="6" fill="#EF4444"/>
  <circle cx="115" cy="76" r="6" fill="#F59E0B"/>
  <circle cx="135" cy="76" r="6" fill="#10B981"/>

  <!-- Address Pill -->
  <rect x="160" y="66" width="320" height="20" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="175" y="80" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">https://school-template.live/demo</text>

  <!-- Centered Wireframe Illustration Icon -->
  <g transform="translate(400, 220)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="48" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="2"/>
    <!-- Wireframe browser / canvas icon -->
    <rect x="-24" y="-20" width="48" height="38" rx="5" fill="#FFFFFF" stroke="#00AF90" stroke-width="2.5"/>
    <line x1="-24" y1="-8" x2="24" y2="-8" stroke="#00AF90" stroke-width="1.5"/>
    <circle cx="-16" cy="-14" r="2" fill="#00AF90"/>
    <circle cx="-10" cy="-14" r="2" fill="#00AF90"/>
    <circle cx="-4" cy="-14" r="2" fill="#00AF90"/>
    <!-- Lines inside canvas -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="8" x2="6" y2="8" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Placeholder Typography -->
  <text x="400" y="315" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1E293B" letter-spacing="-0.2">
    Template Screenshot Placeholder
  </text>
  <text x="400" y="342" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">
    16:10 Ratio • Add your template design image link here
  </text>

  <!-- Tag Pill -->
  <rect x="330" y="370" width="140" height="26" rx="13" fill="#E6F7F4" stroke="#00AF90" stroke-width="1"/>
  <text x="400" y="387" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#008770" letter-spacing="0.5">
    READY FOR DESIGN
  </text>
</svg>
